<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Good Dogs Only</title>
    <meta name="description" content="Spot every dog breed at the park." />
    <meta name="theme-color" content="#dcdcdc" />
    <!-- The theme goes on <html> before anything draws, so the app never flashes the wrong one (see src/theme). -->
    <script>
      try { var t = localStorage.getItem('good-dogs-only.theme') } catch (e) {}
      document.documentElement.dataset.theme = ['aqua', 'glass', 'win98'].indexOf(t) >= 0 ? t : 'aqua'
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Home Screen web app on iPhone: full screen, teal behind the status bar. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Good Dogs" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

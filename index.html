<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Good Dogs Only</title>
    <meta name="description" content="Spot every dog breed at the park." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#e9eef5" />
    <!-- The theme goes on <html> before anything draws, so the app never flashes the wrong one (see src/theme). -->
    <script>
      try { var t = localStorage.getItem('good-dogs-only.theme') } catch (e) {}
      t = ['glass', 'aqua', 'win98'].indexOf(t) >= 0 ? t : 'glass'
      document.documentElement.dataset.theme = t
      document.querySelector('meta[name="theme-color"]').content = { glass: '#e9eef5', aqua: '#dcdcdc', win98: '#008080' }[t]
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Home Screen web app on iPhone: full screen, below a status bar in the theme's colour (theme-color above).
         No black-translucent status bar: since iOS 26.1 the system blurs over the top of a page drawn behind it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Good Dogs" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
